spring.application.name=shop

# Database Connection (Uses Neon PostgreSQL on Render, falls back to permanent H2 file locally)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/crochet_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

# H2 Web Console (Available locally at /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Hibernate Configuration (Auto-detects H2 or PostgreSQL dialect)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Admin secret passcode
app.admin.password=${ADMIN_PASSWORD:crochet@123}